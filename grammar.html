<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ Pháp Master 📚 English Fun Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f1033; --bg2:#1b1c4d;
  --card:#ffffff; --ink:#2d2a55; --muted:#7a77a8;
  --yellow:#ffd23f; --orange:#ff7a48; --pink:#ff5d8f; --violet:#8b5cf6;
  --teal:#22d3aa; --blue:#38bdf8; --red:#ff4d6d; --green:#2dd573;
  --shadow:0 10px 0 rgba(0,0,0,.18);
  --r:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Be Vietnam Pro',sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 80% -10%,#3b2f7d 0%,transparent 60%),
             radial-gradient(900px 500px at -10% 30%,#173b6e 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,h4,.bal{font-family:'Baloo 2',cursive}
button{font-family:inherit;cursor:pointer;border:none}

.doodles{position:fixed;inset:0;pointer-events:none;z-index:0}
.doodle{position:absolute;font-size:30px;opacity:.16;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-26px) rotate(10deg)}}

.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 90px;position:relative;z-index:1}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 4px}
.logo{display:flex;align-items:center;gap:10px}
.logo .rocket{font-size:38px;display:inline-block;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}}
.logo h1{color:#fff;font-size:clamp(21px,4vw,32px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo h1 span{background:linear-gradient(90deg,var(--yellow),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{color:#b9b6ee;font-size:12.5px;margin-top:4px}
.backlink{color:#cfcdf4;text-decoration:none;font-weight:700;font-size:13px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:30px;padding:7px 14px;transition:.15s}
.backlink:hover{background:rgba(255,255,255,.22)}
.player-chip{margin-left:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:50px;padding:7px 14px;color:#fff;backdrop-filter:blur(6px)}
.player-chip .ava{font-size:24px}
.player-chip b{font-family:'Baloo 2';font-size:15px}
.player-chip .xp{font-size:12px;color:var(--yellow);font-weight:700}
.player-chip .lvl{background:linear-gradient(90deg,var(--orange),var(--pink));border-radius:30px;font-size:11px;font-weight:800;padding:3px 9px}
.player-chip button{background:none;color:#b9b6ee;font-size:16px}

.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:3px solid #efedff}
.card h2{font-size:22px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.hidden{display:none!important}
.center{text-align:center}
.mt{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;font-family:'Baloo 2';font-weight:700;font-size:15px;border-radius:40px;padding:11px 22px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.teal{background:linear-gradient(135deg,var(--teal),var(--blue))}
.btn.gold{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#5b3500}
.btn.ghost{background:#efedff;color:var(--ink);box-shadow:0 4px 0 #d8d5f2}

/* hero */
.hero{background:linear-gradient(135deg,#312e81,#6d28d9 60%,#a21caf);border-radius:var(--r);border:3px solid rgba(255,255,255,.25);box-shadow:var(--shadow);color:#fff;padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h2{font-size:clamp(20px,3.4vw,28px);margin-bottom:6px}
.hero p{font-size:13.5px;opacity:.92;max-width:640px}
.hero .big-em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:74px;opacity:.35}
.hero .stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.hero .hstat{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:7px 14px;font-size:12.5px;font-weight:700}
.hero .hstat b{font-family:'Baloo 2';font-size:17px;color:var(--yellow)}

/* topic map */
.tmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));gap:12px}
.tcard{background:#fff;border:3px solid #efedff;border-radius:18px;padding:14px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.tcard:hover{transform:translateY(-4px);border-color:#c7bfff;box-shadow:0 8px 18px rgba(80,60,180,.18)}
.tcard .no{position:absolute;top:10px;right:12px;font-family:'Baloo 2';font-weight:800;font-size:12px;color:#b9b6d0}
.tcard .em{font-size:34px;display:block;margin-bottom:4px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.tcard .nm{font-family:'Baloo 2';font-weight:800;font-size:15.5px;line-height:1.15}
.tcard .sb{color:var(--muted);font-size:11.5px;margin-top:2px}
.tcard .pbar{height:8px;border-radius:6px;background:#efedff;margin-top:10px;overflow:hidden}
.tcard .pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:.4s}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
.tcard .medal{font-size:15px}

/* topic view */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{background:rgba(255,255,255,.1);color:#cfcdf4;border:2px solid rgba(255,255,255,.16);border-radius:40px;padding:9px 16px;font-weight:700;font-size:13.5px;transition:.15s;backdrop-filter:blur(8px)}
.step.on{background:#fff;color:var(--ink);transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.step .tick{color:var(--green);margin-left:4px}

/* theory content */
.gp-theory h3{font-size:17px;margin:16px 0 8px;display:flex;gap:7px;align-items:center;color:#4c1d95}
.gp-theory h3:first-child{margin-top:0}
.gp-theory p{font-size:14px;line-height:1.55;margin-bottom:8px}
.gp-theory ul{margin:0 0 10px 20px;font-size:14px;line-height:1.6}
.gp-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin:8px 0 14px;border:2px solid #e4e0ff;border-radius:14px;overflow:hidden}
.gp-table th{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:8px 10px;text-align:left;font-size:12.5px}
.gp-table td{padding:8px 10px;border-top:1px solid #efedff;vertical-align:top;line-height:1.5}
.gp-table tr:nth-child(even) td{background:#faf9ff}
.gp-table b.f{color:#7c3aed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{background:#ede9fe;color:#6d28d9;border-radius:20px;padding:4px 12px;font-weight:700;font-size:12px}
.tipbox{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #6ee7b7;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:13.5px;line-height:1.55}
.tipbox b.t{color:#047857}
.trapbox{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border:2px solid #fda4af;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:13.5px;line-height:1.55}
.trapbox b.t{color:#be123c}
.fml{background:#1e1b4b;color:#e0e7ff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13.5px;margin:8px 0;display:inline-block}
.fml em{color:var(--yellow);font-style:normal}

/* examples */
.exlist{display:grid;gap:10px}
.excard{background:#faf9ff;border:2px solid #e4e0ff;border-radius:14px;padding:12px 14px}
.excard .en{font-weight:700;font-size:14.5px}
.excard .en mark{background:#fef08a;border-radius:5px;padding:0 4px}
.excard .vn{color:var(--muted);font-size:13px;margin-top:4px}
.excard .nt{margin-top:6px;font-size:12.5px;color:#0e7490;background:#ecfeff;border-radius:8px;padding:5px 9px;display:inline-block;font-weight:600}

/* practice */
.lvlchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lvlchip{border-radius:30px;padding:9px 18px;font-weight:800;font-size:13.5px;border:3px solid transparent;transition:.15s}
.lvlchip.l1{background:#dcfce7;color:#15803d}.lvlchip.l1.on{border-color:#15803d}
.lvlchip.l2{background:#fef9c3;color:#a16207}.lvlchip.l2.on{border-color:#a16207}
.lvlchip.l3{background:#ffe4e6;color:#be123c}.lvlchip.l3.on{border-color:#be123c}
.lvlchip.l4{background:#fae8ff;color:#a21caf}.lvlchip.l4.on{border-color:#a21caf}
.lvlchip:hover{transform:translateY(-2px)}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qcount{font-family:'Baloo 2';font-weight:800;font-size:14px;color:var(--violet);white-space:nowrap}
.qprog{flex:1;height:10px;background:#efedff;border-radius:8px;overflow:hidden}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:8px;transition:.3s}
.streakBadge{font-weight:800;font-size:13px;color:var(--orange);white-space:nowrap}
.qq{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:14px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:10px;background:#faf9ff;border:2.5px solid #e4e0ff;border-radius:14px;padding:11px 13px;font-size:14.5px;font-weight:600;text-align:left;transition:.14s;line-height:1.45}
.opt:hover:not(:disabled){border-color:#b9a8ff;transform:translateX(3px)}
.opt .ab{background:#e4e0ff;color:#6d28d9;font-family:'Baloo 2';font-weight:800;border-radius:8px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.opt.right{background:#dcfce7;border-color:#22c55e}
.opt.right .ab{background:#22c55e;color:#fff}
.opt.wrong{background:#ffe4e6;border-color:#f43f5e}
.opt.wrong .ab{background:#f43f5e;color:#fff}
.opt.dim{opacity:.5}
.feedback{margin-top:12px;border-radius:14px;padding:11px 14px;font-size:13.5px;display:none;line-height:1.5}
.feedback.ok{display:block;background:#ecfdf5;border:2px solid #6ee7b7;color:#065f46}
.feedback.no{display:block;background:#fff1f2;border:2px solid #fda4af;color:#9f1239}
.result{text-align:center;padding:10px 0}
.result .face{font-size:64px;animation:pop .4s ease}
.result h3{font-size:24px;margin:8px 0 4px}
.result .scoreline{color:var(--muted);font-weight:600;margin-bottom:8px}
.xpgain{display:inline-block;background:linear-gradient(90deg,var(--yellow),var(--orange));color:#5b3500;font-family:'Baloo 2';font-weight:800;border-radius:30px;padding:7px 18px;margin:8px 0 14px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
section{animation:pop .3s ease}

/* fx */
.confetti{position:fixed;top:-14px;z-index:999;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.xp-fly{position:fixed;z-index:999;font-family:'Baloo 2';font-weight:800;color:var(--yellow);text-shadow:0 2px 0 rgba(0,0,0,.4);animation:flyup 1s ease forwards;pointer-events:none;font-size:18px}
@keyframes flyup{to{transform:translateY(-70px);opacity:0}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:12px 20px;font-weight:700;font-size:14px;z-index:998;transition:.3s;opacity:0;max-width:88vw}
#toast.show{transform:translateX(-50%);opacity:1}

@media(max-width:560px){
  .tmap{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .hero .big-em{display:none}
}
</style>
</head>
<body>
<div class="doodles" id="doodles"></div>
<div class="wrap">
  <header>
    <a class="backlink" href="index.html">← Fun Zone</a>
    <div class="logo">
      <span class="rocket">📚</span>
      <div>
        <h1>Ngữ Pháp <span>Master</span></h1>
        <p id="gpCount">33 chuyên đề · Lý thuyết → Ví dụ → Luyện tập → Kiểm tra</p>
      </div>
    </div>
    <div class="player-chip" id="chip">
      <span class="ava" id="pAva">🐣</span>
      <div><b id="pName">Bạn học</b><div class="xp">⭐ <span id="pXP">0</span> XP</div></div>
      <span class="lvl" id="pLvl">Lv.1</span>
      <button id="sndToggleBtn" onclick="toggleSound()" title="Âm thanh">🔊</button>
    </div>
  </header>

  <div id="app"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ================= CORE ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a).slice(0,n);

/* shared player profile with index.html */
const LS_PLAYERS='efz_players', LS_CUR='efz_current';
function loadPlayers(){try{return JSON.parse(localStorage.getItem(LS_PLAYERS))||{}}catch(e){return{}}}
let P=(()=>{
  const cur=localStorage.getItem(LS_CUR),ps=loadPlayers();
  if(cur&&ps[cur])return ps[cur];
  return {name:'Bạn học',ava:'🐣',xp:0,correct:0,maxStreak:0,badges:[],quizDone:0,readDone:0,listenDone:0,writeDone:0,gameWins:0,perfect:0,_guest:true};
})();
function persist(){
  if(P._guest){localStorage.setItem('efz_gp_guest',JSON.stringify({xp:P.xp,correct:P.correct}));renderPlayer();return}
  const ps=loadPlayers();ps[P.name]=P;localStorage.setItem(LS_PLAYERS,JSON.stringify(ps));renderPlayer();
}
if(P._guest){try{const g=JSON.parse(localStorage.getItem('efz_gp_guest'));if(g){P.xp=g.xp||0;P.correct=g.correct||0}}catch(e){}}
const lvlOf=xp=>Math.floor(Math.sqrt(xp/25))+1;
function renderPlayer(){$('pName').textContent=P.name;$('pAva').textContent=P.ava;$('pXP').textContent=P.xp;$('pLvl').textContent='Lv.'+lvlOf(P.xp)}

/* per-topic progress, per player */
const GPKEY='efz_gp_prog_'+(P._guest?'guest':P.name);
let PR={};try{PR=JSON.parse(localStorage.getItem(GPKEY))||{}}catch(e){PR={}}
function prOf(id){if(!PR[id])PR[id]={theory:0,ex:0,lv:{},test:0};if(!PR[id].lv)PR[id].lv={};return PR[id]}
function savePR(){localStorage.setItem(GPKEY,JSON.stringify(PR))}
function topicPct(t){
  const p=prOf(t.id);let done=0;
  if(p.theory)done++;if(p.ex)done++;
  done+=Math.min(2,Object.keys(p.lv).length*.5);
  if(p.test>=60)done++;
  return Math.round(done/5*100);
}

/* sounds */
let AC=null,soundOn=localStorage.getItem('efz_snd')!=='0';
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,dur,type='sine',vol=.18){if(!soundOn)return;try{
  const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(vol,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+dur);
  o.start(a.currentTime+t);o.stop(a.currentTime+t+dur+.02);
}catch(e){}}
const sndOK=()=>{tone(523,0,.1,'sine',.2);tone(659,.09,.1,'sine',.2);tone(784,.18,.22,'sine',.22)};
const sndNo=()=>{tone(300,0,.07,'sawtooth',.14);tone(200,.07,.22,'sawtooth',.1)};
const sndWin=()=>{[523,659,784,988,1319].forEach((f,i)=>tone(f,i*.1,.22,'sine',.2))};
const sndClick=()=>tone(880,0,.045,'triangle',.09);
const sndFlip=()=>{tone(660,0,.04,'triangle',.12);tone(880,.04,.06,'triangle',.08)};
const sndLevelUp=()=>{[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.18,'sine',.18))};
function toggleSound(){soundOn=!soundOn;localStorage.setItem('efz_snd',soundOn?'1':'0');$('sndToggleBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)sndClick()}

/* fx */
function confetti(n=60){
  const cols=['#ffd23f','#ff5d8f','#8b5cf6','#22d3aa','#38bdf8','#ff7a48'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='confetti';
    const s=6+Math.random()*8;
    d.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*(Math.random()>.5?1:.4)}px;background:${cols[i%6]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),5500);
  }
}
function xpFly(amount,x,y){
  const d=document.createElement('div');d.className='xp-fly';d.textContent='+'+amount+' XP ⭐';
  d.style.left=(x||innerWidth/2)+'px';d.style.top=(y||innerHeight/2)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}
let toastT=null;
function toast(msg,ms=2600){const t=$('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}
function gainXP(n,ev){
  P.xp+=n;
  if(ev)xpFly(n,ev.clientX,ev.clientY);else xpFly(n);
  const before=lvlOf(P.xp-n),after=lvlOf(P.xp);
  if(after>before){confetti(80);sndLevelUp();toast('🎉 <b>LEVEL UP!</b> Bạn đã lên cấp '+after+'!')}
  persist();
}

/* doodles */
(function(){
  const ems=['📚','✏️','⭐','🧩','💡','🔤','🏆','🎯','🌈','📝'];
  $('doodles').innerHTML=ems.map((e,i)=>`<span class="doodle" style="left:${(i*10+4)%92}%;top:${(i*23+8)%86}%;animation-delay:${i*.7}s">${e}</span>`).join('');
})();

/* ================= DATA ================= */
const LV_NAMES={1:'🟢 Dễ',2:'🟡 Vừa',3:'🔴 Khó',4:'🟣 Nâng cao'};
const CHEERS=['Tuyệt vời! 🌟','Đỉnh quá! 🚀','Chuẩn luôn! 💯','Quá giỏi! 🥳','Xuất sắc! ✨','Cao thủ ngữ pháp! 🧠'];
const COMFORTS=['Không sao, sai để nhớ lâu hơn! 💪','Gần đúng rồi, đọc giải thích nhé! 🔍','Bình tĩnh, câu sau gỡ lại! 🌈','Bẫy đấy! Lần sau né nha 😉'];
const GP_DATA=[];
/* ---------- 1. THÌ ĐỘNG TỪ ---------- */
GP_DATA.push({
id:'tenses',em:'⏰',name:'Thì Động Từ',sub:'12 thì cơ bản — công thức & dấu hiệu',
theory:`
<h3>🗂️ Bảng tổng hợp 12 thì</h3>
<table class="gp-table">
<tr><th>Thì</th><th>Công thức (+)</th><th>Cách dùng chính</th><th>Dấu hiệu nhận biết</th></tr>
<tr><td><b>Hiện tại đơn</b></td><td><b class="f">S + V(s/es)</b></td><td>thói quen, sự thật, lịch trình</td><td>always, usually, often, every..., never</td></tr>
<tr><td><b>Hiện tại tiếp diễn</b></td><td><b class="f">S + am/is/are + V-ing</b></td><td>đang xảy ra lúc nói; kế hoạch chắc chắn</td><td>now, at the moment, Look!, Listen!</td></tr>
<tr><td><b>Hiện tại hoàn thành</b></td><td><b class="f">S + have/has + V3</b></td><td>đã xảy ra, kết quả còn ở hiện tại</td><td>just, already, yet, ever, never, since, for, so far</td></tr>

/* ==APPEND_TOPICS== */

/* ================= VIEWS ================= */
let CUR=null, PRC=null;

function home(){
  CUR=null;window.scrollTo({top:0});
  const totalTest=GP_DATA.filter(t=>prOf(t.id).test>=60).length;
  const avg=Math.round(GP_DATA.reduce((s,t)=>s+topicPct(t),0)/GP_DATA.length);
  {const el=$('gpCount');if(el)el.textContent=GP_DATA.length+' chuyên đề · Lý thuyết → Ví dụ → Luyện tập → Kiểm tra'}
  $('app').innerHTML=`
  <div class="hero">
    <span class="big-em">🧠</span>
    <h2>Chinh phục ${GP_DATA.length} chuyên đề ngữ pháp! 🏔️</h2>
    <p>Học theo lộ trình 4 bước: <b>📖 Lý thuyết → 💡 Ví dụ → ✏️ Luyện tập (4 mức độ) → 🏆 Kiểm tra</b>. Dựa theo sách "Tổng ôn Ngữ pháp Tiếng Anh". Mỗi câu đúng được cộng XP, đạt ≥60% bài kiểm tra để nhận huy chương!</p>
    <div class="stats">
      <div class="hstat">📈 Tiến độ chung <b>${avg}%</b></div>
      <div class="hstat">🏅 Huy chương <b>${totalTest}/${GP_DATA.length}</b></div>
      <div class="hstat">⭐ XP <b>${P.xp}</b></div>
    </div>
  </div>
  <div class="tmap">
    ${GP_DATA.map((t,i)=>{
      const p=prOf(t.id),pct=topicPct(t);
      const medal=p.test>=90?'🥇':p.test>=75?'🥈':p.test>=60?'🥉':'';
      return `<div class="tcard" onclick="openTopic('${t.id}')">
        <span class="no">#${i+1}</span>
        <span class="em">${t.em}</span>
        <div class="nm">${t.name}</div>
        <div class="sb">${t.sub}</div>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <div class="meta"><span>${pct}% hoàn thành</span><span class="medal">${medal||'·'}</span></div>
      </div>`;
    }).join('')}
  </div>`;
}

function openTopic(id,step){
  CUR=GP_DATA.find(t=>t.id===id);if(!CUR)return home();
  sndClick();window.scrollTo({top:0});
  step=step||'theory';
  const p=prOf(id);
  $('app').innerHTML=`
  <div class="row" style="margin-bottom:12px">
    <button class="btn ghost" onclick="home()">← Bản đồ chuyên đề</button>
    <h2 style="color:#fff;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.3)">${CUR.em} ${CUR.name}</h2>
  </div>
  <div class="steps">
    <button class="step ${step==='theory'?'on':''}" onclick="openTopic('${id}','theory')">📖 Lý thuyết ${p.theory?'<span class="tick">✔</span>':''}</button>
    <button class="step ${step==='ex'?'on':''}" onclick="openTopic('${id}','ex')">💡 Ví dụ ${p.ex?'<span class="tick">✔</span>':''}</button>
    <button class="step ${step==='prac'?'on':''}" onclick="openTopic('${id}','prac')">✏️ Luyện tập ${Object.keys(p.lv).length?'<span class="tick">'+Object.keys(p.lv).length+'/4</span>':''}</button>
    <button class="step ${step==='test'?'on':''}" onclick="openTopic('${id}','test')">🏆 Kiểm tra ${p.test?'<span class="tick">'+p.test+'%</span>':''}</button>
  </div>
  <div class="card" id="stepCard"></div>`;
  if(step==='theory')renderTheory();
  else if(step==='ex')renderExamples();
  else if(step==='prac')renderPracHome();
  else renderTestHome();
}

function renderTheory(){
  const p=prOf(CUR.id);
  $('stepCard').innerHTML=`
    <h2>📖 Lý thuyết — ${CUR.name}</h2>
    <p class="sub">${CUR.sub}. Đọc kỹ bảng công thức và các mẹo bên dưới nhé!</p>
    <div class="gp-theory">${CUR.theory}</div>
    <div class="center mt">
      ${p.theory?'<span style="color:var(--green);font-weight:800">✔ Đã đọc xong — +10 XP</span>':`<button class="btn teal" onclick="doneTheory(event)">✅ Mình đã hiểu! (+10 XP)</button>`}
      <button class="btn" onclick="openTopic('${CUR.id}','ex')" style="margin-left:8px">Xem ví dụ ➜</button>
    </div>`;
}
function doneTheory(ev){const p=prOf(CUR.id);if(!p.theory){p.theory=1;savePR();gainXP(10,ev);sndOK();confetti(30)}openTopic(CUR.id,'ex')}

function renderExamples(){
  const p=prOf(CUR.id);
  $('stepCard').innerHTML=`
    <h2>💡 Ví dụ minh hoạ</h2>
    <p class="sub">Chú ý phần <mark style="background:#fef08a;border-radius:4px;padding:0 4px">tô vàng</mark> — đó chính là điểm ngữ pháp đang học!</p>
    <div class="exlist">
      ${CUR.ex.map(e=>`<div class="excard">
        <div class="en">${e.en}</div>
        <div class="vn">🇻🇳 ${esc(e.vn)}</div>
        ${e.nt?`<div class="nt">💡 ${esc(e.nt)}</div>`:''}
      </div>`).join('')}
    </div>
    <div class="center mt">
      ${p.ex?'<span style="color:var(--green);font-weight:800">✔ Đã xem — +5 XP</span>':`<button class="btn teal" onclick="doneEx(event)">✅ Đã hiểu ví dụ! (+5 XP)</button>`}
      <button class="btn" onclick="openTopic('${CUR.id}','prac')" style="margin-left:8px">Luyện tập thôi ➜</button>
    </div>`;
}
function doneEx(ev){const p=prOf(CUR.id);if(!p.ex){p.ex=1;savePR();gainXP(5,ev);sndOK()}openTopic(CUR.id,'prac')}

/* ---- practice ---- */
function renderPracHome(){
  const p=prOf(CUR.id);
  $('stepCard').innerHTML=`
    <h2>✏️ Luyện tập theo mức độ</h2>
    <p class="sub">Mỗi lượt 5 câu chọn ngẫu nhiên · đúng <b>+12 XP/câu</b> · trả lời xong có giải thích chi tiết như trong sách 📚</p>
    <div class="lvlchips">
      ${[1,2,3,4].map(l=>{
        const pool=CUR.qs.filter(q=>q.l===l);
        const best=p.lv[l];
        return `<button class="lvlchip l${l} ${best!=null?'on':''}" onclick="startPrac(${l})">${LV_NAMES[l]} ${best!=null?`· 🏁 ${best}/5`:`· ${pool.length} câu`}</button>`;
      }).join('')}
    </div>
    <p class="sub">💪 Mẹo: làm từ Dễ → Nâng cao. Làm lại bao nhiêu lần cũng được, đề sẽ xáo mỗi lượt!</p>`;
}
function startPrac(l){
  sndClick();
  const pool=CUR.qs.filter(q=>q.l===l);
  PRC={mode:'prac',l,qs:pickN(pool,Math.min(5,pool.length)),i:0,right:0,streak:0};
  renderQ();
}
/* ---- test ---- */
function renderTestHome(){
  const p=prOf(CUR.id);
  const medal=p.test>=90?'🥇 Vàng':p.test>=75?'🥈 Bạc':p.test>=60?'🥉 Đồng':'—';
  $('stepCard').innerHTML=`
    <h2>🏆 Bài kiểm tra chuyên đề</h2>
    <p class="sub">12 câu trộn cả 4 mức độ · đúng <b>+15 XP/câu</b> · đạt ≥60% nhận huy chương 🥉, ≥75% 🥈, ≥90% 🥇</p>
    <div class="row" style="margin-bottom:12px">
      <div class="hstat" style="background:#faf9ff;border:2px solid #e4e0ff;border-radius:14px;padding:8px 14px;font-weight:700">Kết quả tốt nhất: <b style="color:var(--violet)">${p.test||0}%</b> · Huy chương: ${medal}</div>
    </div>
    <button class="btn gold" onclick="startTest()">🚀 Bắt đầu kiểm tra!</button>`;
}
function startTest(){
  sndClick();
  const qs=[...pickN(CUR.qs.filter(q=>q.l===1),3),...pickN(CUR.qs.filter(q=>q.l===2),3),...pickN(CUR.qs.filter(q=>q.l===3),3),...pickN(CUR.qs.filter(q=>q.l===4),3)];
  PRC={mode:'test',qs:shuffle(qs),i:0,right:0,streak:0};
  renderQ();
}

/* ---- shared question UI ---- */
function renderQ(){
  const q=PRC.qs[PRC.i];
  const opts=shuffle([{t:q.a,ok:1},...q.d.map(t=>({t,ok:0}))]);
  PRC.opts=opts;
  $('stepCard').innerHTML=`
    <div class="qbar">
      <span class="qcount">${PRC.mode==='test'?'🏆':'✏️'} Câu ${PRC.i+1}/${PRC.qs.length}</span>
      <div class="qprog"><i style="width:${PRC.i/PRC.qs.length*100}%"></i></div>
      <span class="streakBadge">🔥 ${PRC.streak}</span>
    </div>
    <div class="qq">${q.q}</div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" id="op${k}" onclick="answer(${k},event)"><span class="ab">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <div class="center mt hidden" id="nextRow"><button class="btn teal" onclick="nextQ()">${PRC.i+1<PRC.qs.length?'Câu tiếp theo ➜':'Xem kết quả 🎉'}</button></div>`;
}
function answer(k,ev){
  const q=PRC.qs[PRC.i],o=PRC.opts[k];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  PRC.opts.forEach((oo,kk)=>{
    const b=$('op'+kk);
    if(oo.ok)b.classList.add('right');
    else if(kk===k)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=$('fb');
  if(o.ok){
    PRC.right++;PRC.streak++;P.correct++;
    gainXP(PRC.mode==='test'?15:12,ev);sndOK();
    if(PRC.streak>P.maxStreak)P.maxStreak=PRC.streak;
    fb.className='feedback ok';
    fb.innerHTML=`🎉 <b>${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</b> ${q.e?esc(q.e):''}`;
  }else{
    PRC.streak=0;sndNo();
    fb.className='feedback no';
    fb.innerHTML=`😅 <b>${COMFORTS[Math.floor(Math.random()*COMFORTS.length)]}</b><br>Đáp án đúng: <b>${esc(q.a)}</b>. ${q.e?esc(q.e):''}`;
  }
  persist();
  $('nextRow').classList.remove('hidden');
}
function nextQ(){
  PRC.i++;sndClick();
  if(PRC.i<PRC.qs.length)return renderQ();
  const pct=Math.round(PRC.right/PRC.qs.length*100);
  const p=prOf(CUR.id);
  if(PRC.mode==='prac'){
    if(p.lv[PRC.l]==null||PRC.right>p.lv[PRC.l])p.lv[PRC.l]=PRC.right;
  }else{
    if(pct>p.test)p.test=pct;
    if(pct===100)P.perfect++;
  }
  savePR();persist();
  if(pct>=60){confetti(pct>=90?130:70);sndWin()}
  const face=pct===100?'🏆':pct>=75?'🤩':pct>=50?'😊':'💪';
  const msg=pct===100?'PERFECT! Không sai câu nào!':pct>=75?'Tuyệt vời, sắp thành cao thủ rồi!':pct>=50?'Khá lắm! Ôn thêm chút nữa nha!':'Đọc lại lý thuyết rồi quay lại phục thù nhé!';
  const medal=PRC.mode==='test'?(pct>=90?'<div style="font-size:40px">🥇</div>':pct>=75?'<div style="font-size:40px">🥈</div>':pct>=60?'<div style="font-size:40px">🥉</div>':''):'';
  $('stepCard').innerHTML=`
    <div class="result">
      <div class="face">${face}</div>${medal}
      <h3>${PRC.right}/${PRC.qs.length} câu đúng (${pct}%)</h3>
      <div class="scoreline">${msg}</div>
      <div class="xpgain">⭐ +${PRC.right*(PRC.mode==='test'?15:12)} XP</div>
      <div class="row" style="justify-content:center">
        ${PRC.mode==='prac'
          ?`<button class="btn" onclick="startPrac(${PRC.l})">🔄 Lượt mới</button><button class="btn ghost" onclick="openTopic('${CUR.id}','prac')">← Chọn mức độ</button><button class="btn gold" onclick="openTopic('${CUR.id}','test')">🏆 Thi thử luôn!</button>`
          :`<button class="btn" onclick="startTest()">🔄 Làm lại</button><button class="btn ghost" onclick="openTopic('${CUR.id}','test')">← Chuyên đề</button><button class="btn teal" onclick="home()">🗺️ Bản đồ</button>`}
      </div>
    </div>`;
}

/* init */
window.addEventListener('DOMContentLoaded',()=>{renderPlayer();$('sndToggleBtn').textContent=soundOn?'🔊':'🔇';home()});
</script>
